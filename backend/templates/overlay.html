<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Overlay</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: transparent;
            overflow: hidden;
        }

        .overlay-container {
            position: fixed;
            padding: 12px;
            transition: all 0.3s ease;
        }

        .position-top-center {
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
        }

        .position-top-left {
            top: 20px;
            left: 20px;
        }

        .position-top-right {
            top: 20px;
            right: 20px;
        }

        .position-bottom-left {
            bottom: 20px;
            left: 20px;
        }

        .position-bottom-right {
            bottom: 20px;
            right: 20px;
        }

        .position-bottom-center {
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
        }

        .scorebug {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 10px 16px;
            background: rgba(7, 7, 12, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 8px;
            color: white;
            min-width: 400px;
        }

        .league-info {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: #aaa;
            min-width: 80px;
        }

        .live-indicator {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            font-weight: 600;
        }

        .live-dot {
            width: 6px;
            height: 6px;
            background: #ef4444;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .teams {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        .team {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            min-width: 80px;
        }

        .team-logo {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #333;
        }

        .team-name {
            font-size: 12px;
            font-weight: 500;
        }

        .score {
            font-size: 20px;
            font-weight: 700;
            padding: 0 12px;
        }

        .time {
            font-size: 11px;
            color: #888;
            min-width: 30px;
        }

        .settings-btn {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(7, 7, 12, 0.6);
            backdrop-filter: blur(8px);
            border: none;
            color: white;
            font-size: 18px;
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            opacity: 0.3;
            transition: opacity 0.2s;
        }

        .settings-btn:hover {
            opacity: 1;
        }

        .settings-panel {
            position: fixed;
            top: 50px;
            right: 10px;
            width: 280px;
            background: rgba(7, 7, 12, 0.9);
            backdrop-filter: blur(12px);
            border-radius: 8px;
            padding: 16px;
            color: white;
            display: none;
            z-index: 1000;
        }

        .settings-panel.open {
            display: block;
        }

        .settings-section {
            margin-bottom: 16px;
        }

        .settings-section h3 {
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #aaa;
        }

        .slider-group {
            margin-bottom: 12px;
        }

        .slider-group label {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            margin-bottom: 4px;
        }

        .slider-group input[type="range"] {
            width: 100%;
        }

        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .checkbox-group label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
        }

        .position-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
        }

        .position-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 6px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 10px;
        }

        .position-btn.active {
            background: rgba(59, 130, 246, 0.5);
            border-color: #3b82f6;
        }

        .save-btn {
            width: 100%;
            background: #3b82f6;
            border: none;
            color: white;
            padding: 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .save-btn:hover {
            background: #2563eb;
        }
    </style>
</head>
<body>
    <div id="overlayContainer" class="overlay-container position-{{.Config.Position}}">
        <div class="scorebug" style="opacity: {{.Config.Opacity}}%; backdrop-filter: blur({{.Config.Blur}}px);">
            <div class="league-info">
                <span>BL</span>
            </div>

            <div class="live-indicator">
                <div class="live-dot"></div>
                <span>{{.Match.Minute}}'</span>
            </div>

            <div class="teams">
                <div class="team">
                    <div class="team-logo"></div>
                    <div class="team-name">{{.Match.HomeTeam.ShortName}}</div>
                </div>

                <div class="score">
                    {{.Match.HomeScore}} - {{.Match.AwayScore}}
                </div>

                <div class="team">
                    <div class="team-logo"></div>
                    <div class="team-name">{{.Match.AwayTeam.ShortName}}</div>
                </div>
            </div>

            <div class="time">{{.Match.Status}}</div>
        </div>
    </div>

    <button class="settings-btn" onclick="toggleSettings()">⚙</button>

    <div id="settingsPanel" class="settings-panel">
        <div class="settings-section">
            <h3>Anzeige</h3>
            <div class="slider-group">
                <label>
                    <span>Transparenz</span>
                    <span id="opacityValue">{{.Config.Opacity}}%</span>
                </label>
                <input type="range" id="opacitySlider" min="5" max="50" value="{{.Config.Opacity}}">
            </div>

            <div class="slider-group">
                <label>
                    <span>Blur</span>
                    <span id="blurValue">{{.Config.Blur}}px</span>
                </label>
                <input type="range" id="blurSlider" min="0" max="20" value="{{.Config.Blur}}">
            </div>
        </div>

        <div class="settings-section">
            <h3>Position</h3>
            <div class="position-grid">
                <button class="position-btn" data-pos="top-left">TL</button>
                <button class="position-btn" data-pos="top-center">TC</button>
                <button class="position-btn" data-pos="top-right">TR</button>
                <button class="position-btn" data-pos="bottom-left">BL</button>
                <button class="position-btn" data-pos="bottom-center">BC</button>
                <button class="position-btn" data-pos="bottom-right">BR</button>
            </div>
        </div>

        <div class="settings-section">
            <h3>Datenfelder</h3>
            <div class="checkbox-group">
                <label>
                    <input type="checkbox" id="showScorers" {{if .Config.ShowScorers}}checked{{end}}>
                    Torschützen
                </label>
                <label>
                    <input type="checkbox" id="showCards" {{if .Config.ShowCards}}checked{{end}}>
                    Karten
                </label>
                <label>
                    <input type="checkbox" id="showStats" {{if .Config.ShowStats}}checked{{end}}>
                    Statistiken
                </label>
            </div>
        </div>

        <button class="save-btn" onclick="saveConfig()">Speichern</button>
    </div>

    <script>
        const matchId = window.location.pathname.split('/')[3];
        let selectedPosition = '{{.Config.Position}}';

        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.position-btn').forEach(btn => {
                if (btn.dataset.pos === selectedPosition) {
                    btn.classList.add('active');
                }
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.position-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    selectedPosition = btn.dataset.pos;
                });
            });

            document.getElementById('opacitySlider').addEventListener('input', (e) => {
                document.getElementById('opacityValue').textContent = e.target.value + '%';
            });

            document.getElementById('blurSlider').addEventListener('input', (e) => {
                document.getElementById('blurValue').textContent = e.target.value + 'px';
            });

            setInterval(() => location.reload(), 10000);
        });

        function toggleSettings() {
            document.getElementById('settingsPanel').classList.toggle('open');
        }

        function saveConfig() {
            const config = {
                opacity: parseInt(document.getElementById('opacitySlider').value),
                blur: parseInt(document.getElementById('blurSlider').value),
                position: selectedPosition,
                showScorers: document.getElementById('showScorers').checked,
                showCards: document.getElementById('showCards').checked,
                showStats: document.getElementById('showStats').checked,
                visibleFields: ['score', 'time', 'teams']
            };

            fetch(`/v1/matches/${matchId}/config`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(config)
            }).then(() => {
                alert('Konfiguration gespeichert!');
                toggleSettings();
            });
        }
    </script>
</body>
</html>
