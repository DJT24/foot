{{define "gui.html"}}<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bundesliga Overlay</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Roboto', sans-serif;
            background: transparent;
            overflow: hidden;
        }
        .overlay-container {
            position: fixed;
            padding: 12px;
        }
        .position-top-center {
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
        }
        .scorebug {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 10px 16px;
            background: rgba(210, 5, 21, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 8px;
            color: white;
            min-width: 450px;
            border: 2px solid #fff;
        }
        .league-logo {
            width: 40px;
            height: 40px;
            object-fit: contain;
        }
        .live-indicator {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            font-weight: 600;
            background: #fff;
            color: #D20515;
            padding: 4px 8px;
            border-radius: 4px;
        }
        .live-dot {
            width: 6px;
            height: 6px;
            background: #D20515;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .teams {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }
        .team {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            min-width: 80px;
        }
        .team-logo {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #fff;
            padding: 2px;
        }
        .team-name {
            font-size: 13px;
            font-weight: 600;
        }
        .score {
            font-size: 24px;
            font-weight: 700;
            padding: 0 16px;
            background: #fff;
            color: #D20515;
            border-radius: 4px;
        }
        .time {
            font-size: 11px;
            color: #fff;
            min-width: 30px;
        }
    </style>
</head>
<body>
    <div id="overlayContainer" class="overlay-container position-{{.Config.Position}}">
        <div class="scorebug" style="opacity: {{.Config.Opacity}}%; backdrop-filter: blur({{.Config.Blur}}px);">
            <img src="{{.League.LogoURL}}" alt="{{.League.Name}}" class="league-logo">
            
            <div class="live-indicator">
                <div class="live-dot"></div>
                <span>{{.Match.Minute}}'</span>
            </div>
            
            <div class="teams">
                <div class="team">
                    <div class="team-logo"></div>
                    <div class="team-name">{{.Match.HomeTeam.ShortName}}</div>
                </div>
                
                <div class="score">
                    {{.Match.HomeScore}} - {{.Match.AwayScore}}
                </div>
                
                <div class="team">
                    <div class="team-logo"></div>
                    <div class="team-name">{{.Match.AwayTeam.ShortName}}</div>
                </div>
            </div>
            
            <div class="time">{{.Match.Status}}</div>
        </div>
    </div>
    
    <script>
        setInterval(() => location.reload(), 10000);
    </script>
</body>
</html>{{end}}
