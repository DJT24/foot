<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Champions League Overlay</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Arial', sans-serif;
            background: transparent;
            overflow: hidden;
        }
        .overlay-container {
            position: fixed;
            padding: 12px;
        }
        .position-top-center {
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
        }
        .scorebug {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px 20px;
            background: linear-gradient(135deg, rgba(0, 31, 92, 0.95), rgba(0, 20, 60, 0.9));
            backdrop-filter: blur(12px);
            border-radius: 12px;
            color: white;
            min-width: 500px;
            border: 2px solid #00ff85;
            box-shadow: 0 4px 20px rgba(0, 255, 133, 0.3);
        }
        .league-logo {
            width: 50px;
            height: 50px;
            object-fit: contain;
        }
        .live-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 700;
            background: linear-gradient(135deg, #00ff85, #00cc6a);
            color: #001f5c;
            padding: 6px 12px;
            border-radius: 20px;
            text-transform: uppercase;
        }
        .live-dot {
            width: 8px;
            height: 8px;
            background: #fff;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }
        .teams {
            display: flex;
            align-items: center;
            gap: 16px;
            flex: 1;
        }
        .team {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            min-width: 100px;
        }
        .team-logo {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            padding: 4px;
        }
        .team-name {
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
        }
        .score {
            font-size: 28px;
            font-weight: 800;
            padding: 0 20px;
            background: linear-gradient(135deg, #00ff85, #00cc6a);
            color: #001f5c;
            border-radius: 8px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }
        .time {
            font-size: 12px;
            color: #00ff85;
            min-width: 40px;
            text-align: center;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div id="overlayContainer" class="overlay-container position-{{.Config.Position}}">
        <div class="scorebug" style="opacity: {{.Config.Opacity}}%; backdrop-filter: blur({{.Config.Blur}}px);">
            <img src="{{.League.LogoURL}}" alt="{{.League.Name}}" class="league-logo">
            
            <div class="live-indicator">
                <div class="live-dot"></div>
                <span>LIVE {{.Match.Minute}}'</span>
            </div>
            
            <div class="teams">
                <div class="team">
                    <img src="" alt="{{.Match.HomeTeam.ShortName}}" class="team-logo">
                    <div class="team-name">{{.Match.HomeTeam.ShortName}}</div>
                </div>
                
                <div class="score">
                    {{.Match.HomeScore}} - {{.Match.AwayScore}}
                </div>
                
                <div class="team">
                    <img src="" alt="{{.Match.AwayTeam.ShortName}}" class="team-logo">
                    <div class="team-name">{{.Match.AwayTeam.ShortName}}</div>
                </div>
            </div>
            
            <div class="time">{{.Match.Status}}</div>
        </div>
    </div>
    
    <script>
        setInterval(() => location.reload(), 10000);
    </script>
</body>
</html>
